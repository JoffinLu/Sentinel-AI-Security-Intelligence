version: "3.9"

# 情报系统核心依赖：PostgreSQL(pgvector) / Neo4j / Redis
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aiintel-postgres
    environment:
      POSTGRES_DB: ai_security_intel
      POSTGRES_USER: aiintel
      POSTGRES_PASSWORD: aiintel2026
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiintel -d ai_security_intel"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - intel-net
    restart: unless-stopped

  neo4j:
    image: neo4j:5-community
    container_name: aiintel-neo4j
    environment:
      NEO4J_AUTH: neo4j/aiintel2026
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512M
    ports:
      - "17474:7474"
      - "17687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - intel-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aiintel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - intel-net
    restart: unless-stopped

volumes:
  postgres_data:
  neo4j_data:
  redis_data:

networks:
  intel-net:
    driver: bridge
