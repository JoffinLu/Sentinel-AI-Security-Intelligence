name: CI/CD

# 赛题要求：CI 全绿作为工程质量举证
# 流水线：静态检查 → 单元测试 → 评测 → 前端构建 → 镜像构建

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ---------- 1. Python 静态检查 ----------
  lint:
    name: 静态检查（ruff）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: 代码规范检查
        # F=pyflakes(py语法/未用导入) E9=语法错误 —— 阻断性检查
        run: ruff check --select F,E9 项目源码/ 评测/

      - name: 完整规范检查（不阻断）
        run: ruff check 项目源码/ 评测/ || true

  # ---------- 2. 单元测试 ----------
  test:
    name: 单元测试（pytest）
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: ai_security_intel
          POSTGRES_USER: aiintel
          POSTGRES_PASSWORD: aiintel2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiintel"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install fastapi "uvicorn[standard]" pydantic pydantic-settings
          pip install "sqlalchemy[asyncio]" asyncpg "psycopg[binary]" pgvector redis apscheduler
          pip install httpx aiohttp tenacity structlog
          pip install feedparser lxml beautifulsoup4 pyyaml
          pip install langgraph langchain-core neo4j
          pip install prometheus-client python-dateutil orjson ruff

      - name: 等待数据库就绪
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -U aiintel; then break; fi
            sleep 2
          done

      - name: 运行业务逻辑单元测试
        # 跳过需要嵌入模型/图谱的集成用例，保持 CI 时长可控
        run: |
          pytest 评测/tests/ -v \
            --ignore=评测/tests/test_qa.py \
            -k "not (graph or coreference)"

  # ---------- 3. 前端构建 ----------
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: 前端界面/package-lock.json

      - name: 安装依赖
        working-directory: 前端界面
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 类型检查
        working-directory: 前端界面
        run: npx tsc --noEmit

      - name: 构建产物
        working-directory: 前端界面
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: 前端界面/dist
          retention-days: 7

  # ---------- 4. 镜像构建 ----------
  docker:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [test, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建后端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 运维/Dockerfile.后端
          tags: aiintel-backend:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: 运维/Dockerfile.前端
          tags: aiintel-frontend:${{ github.sha }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 校验 Compose 配置
        run: docker compose -f 运维/docker-compose.全栈.yml config --quiet

  # ---------- 5. 汇总 ----------
  summary:
    name: 质量汇总
    runs-on: ubuntu-latest
    needs: [lint, test, frontend, docker]
    if: always()
    steps:
      - name: 输出结果
        run: |
          echo "=== CI 结果 ==="
          echo "静态检查: ${{ needs.lint.result }}"
          echo "单元测试: ${{ needs.test.result }}"
          echo "前端构建: ${{ needs.frontend.result }}"
          echo "镜像构建: ${{ needs.docker.result }}"
          if [ "${{ needs.lint.result }}" = "success" ] && \
             [ "${{ needs.test.result }}" = "success" ] && \
             [ "${{ needs.frontend.result }}" = "success" ]; then
            echo ""
            echo "全部通过 ✅"
          else
            echo ""
            echo "存在失败项 ❌"
            exit 1
          fi
